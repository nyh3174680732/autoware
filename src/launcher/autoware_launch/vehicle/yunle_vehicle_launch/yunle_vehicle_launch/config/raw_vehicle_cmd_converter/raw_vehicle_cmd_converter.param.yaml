/**:
  ros__parameters:
    csv_path_accel_map: $(find-pkg-share yunle_vehicle_launch)/data/accel_map.csv
    csv_path_brake_map: $(find-pkg-share yunle_vehicle_launch)/data/brake_map.csv
    csv_path_steer_map: $(find-pkg-share yunle_vehicle_launch)/data/steer_map.csv
    convert_accel_cmd: true
    convert_brake_cmd: true
    convert_steer_cmd: false
    use_steer_ff: true
    use_steer_fb: true
    is_debugging: false
    max_throttle: 0.4
    max_brake: 0.8
    max_steer: 10.0
    min_steer: -10.0
    steer_pid:
      kp: 150.0
      ki: 15.0
      kd: 0.0
      max: 8.0
      min: -8.0
      max_p: 8.0
      min_p: -8.0
      max_i: 8.0
      min_i: -8.0
      max_d: 0.0
      min_d: 0.0
      invalid_integration_decay: 0.97
    convert_steer_cmd_method: "vgr"  # "vgr" or "steer_map"
    vgr_coef_a: 15.713
    vgr_coef_b: 0.053
    vgr_coef_c: 0.042
    convert_actuation_to_steering_status: false  # 是否将控制命令转换为转向状态发布出去
    #模式1 (false): 只有input生效，车辆驱动发布steering_status
    # 车辆驱动 --发布--> /vehicle/status/steering_status
    #                       ↓
    #             raw_vehicle_cmd_converter (订阅，用于PID反馈)

    #             不发布 output/steering_status
    # input_steering: ✅ 订阅，用于转向PID控制的反馈
    # output_steering_status: ❌ 不发布（虽然配置了但不生效）
    
    #模式2 (true): output生效，converter 自己估算并发布steering_status
    # raw_vehicle_cmd_converter 
    #   ↓ (根据 actuation_cmd 估算)
    #   发布--> /vehicle/status/steering_status
    #   ↓
    #   自己又订阅回来用于PID
